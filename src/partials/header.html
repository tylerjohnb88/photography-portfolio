<header
  class="sticky md:fixed top-0 left-0 w-full z-[9999] bg-white/70 dark:bg-black/70 backdrop-blur md:h-[6rem]"
  style="
    /* iOS Safari 'sticky' support + compositing to prevent detaching */
    position: -webkit-sticky;
    backface-visibility: hidden;
    transform: translateZ(0);
    /* Notch safe-area */
    padding-top: constant(safe-area-inset-top);
    padding-top: env(safe-area-inset-top);
  "
>
  <div class="container mx-auto flex items-center md:h-full px-8 md:px-20 py-3 md:py-0">
    <!-- Navbar -->
    <nav id="nav" x-data="{ open: false }" role="navigation" class="w-full">
      <div class="flex items-center relative w-full">
        <!-- Logo for mobile and text for md+ -->
        <a href="index.html" class="flex items-center">
          <!-- Mobile-only logo -->
          <img src="dist/assets/favicons/adaptive.svg" alt="Logo"
               class="h-12 block md:hidden dark:hidden" />
          <img src="dist/assets/favicons/adaptive.svg" alt="Logo"
               class="h-12 hidden md:hidden dark:block" />
          <!-- Desktop text branding -->
          <!-- <span class="hidden md:inline text-2xl font-signika font-bold ml-3">
            Tyler Bartholomew Photography
          </span> -->
        </a>

        <!-- Hamburger (mobile only) -->
        <div class="ml-auto md:hidden flex items-center relative">
          <button @click="open = !open"
                  class="tap-highlight-transparent text-black dark:text-white w-14 h-14 flex items-center justify-center focus:outline-none z-20 rounded-md"
                  aria-label="Toggle navigation">
            <span class="sr-only">Open main menu</span>
            <div class="w-5 h-5 flex items-center justify-center relative">
              <span aria-hidden="true"
                    class="block absolute h-0.5 w-5 bg-current transition duration-500 ease-in-out"
                    :class="{'rotate-45': open,' -translate-y-1.5': !open }"></span>
              <span aria-hidden="true"
                    class="block absolute h-0.5 w-5 bg-current transition duration-500 ease-in-out"
                    :class="{'opacity-0': open }"></span>
              <span aria-hidden="true"
                    class="block absolute h-0.5 w-5 bg-current transition duration-500 ease-in-out"
                    :class="{'-rotate-45': open, ' translate-y-1.5': !open}"></span>
            </div>
          </button>

          <!-- Mobile dropdown -->
          <div id="menu"
               :class="{'h-auto opacity-100 pointer-events-auto': open, 'h-0 opacity-0 pointer-events-none': !open }"
               class="absolute right-0 top-full w-40 bg-white dark:bg-black rounded shadow-lg transition-all ease-out duration-500 overflow-hidden z-10 md:hidden"
               style="
                 /* little gap + safe-area */
                 margin-top: calc(1rem + constant(safe-area-inset-top));
                 margin-top: calc(1rem + env(safe-area-inset-top));
               ">
            <ul id="ulMenu" class="flex flex-col duration-300 ease-out mt-2 space-y-2 px-4 py-2">
              <li class="group transition duration-300">
                <a href="index.html" class="font-signika text-2xl tap-highlight-transparent">Overview</a>
              </li>
              <li class="group transition duration-300">
                <a href="info.html" class="font-signika text-2xl tap-highlight-transparent">Info</a>
              </li>
            </ul>
          </div>
        </div>

        <!-- Desktop menu -->
        <div class="hidden md:flex md:flex-grow md:items-center">
          <ul id="ulMenu-desktop" class="flex flex-row space-x-5 ml-auto items-center">
            <li class="group transition duration-300">
              <a href="index.html" class="font-signika text-2xl tap-highlight-transparent">
                Overview
                <!-- hover underline only; active state handled by JS -->
                <span class="hidden md:block max-w-0 group-hover:max-w-full transition-all duration-500 h-0.5 bg-black dark:bg-white"></span>
              </a>
            </li>
            <li class="group transition duration-300">
              <a href="info.html" class="font-signika text-2xl tap-highlight-transparent">
                Info
                <!-- hover underline only; active state handled by JS -->
                <span class="hidden md:block max-w-0 group-hover:max-w-full transition-all duration-500 h-0.5 bg-black dark:bg-white"></span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
</header>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Normalize filename (handles /, empty, and case)
    const page = (window.location.pathname.split('/').pop() || '').toLowerCase();

    ['ulMenu', 'ulMenu-desktop'].forEach(function(menuId) {
      const menu = document.getElementById(menuId);
      if (!menu) return;

      menu.querySelectorAll('a').forEach(function(link) {
        const hrefPage = (link.getAttribute('href') || '').split('/').pop().toLowerCase();
        const isHome = (page === '' || page === 'index.html') && (hrefPage === '' || hrefPage === 'index.html');
        const isInfo = (page === 'info.html') && (hrefPage === 'info.html');

        if (isHome || isInfo) {
          link.classList.add('border-b-2', 'border-black', 'dark:border-white');
        } else {
          link.classList.remove('border-b-2', 'border-black', 'dark:border-white');
        }
      });
    });
  });
</script>
