<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tyler Bartholomew - Projects</title>
  <meta name="description" content="Selected photography projects by Tyler Bartholomew.">

  <!-- Favicon -->
  <link rel="icon" href="dist/assets/favicons/adaptive.svg" />

  <!-- Match your other pages -->
  <link rel="stylesheet" href="dist/output.css" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Alpine + Tailwind (same pattern as Overview) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: ["./dist/*.{html,js}"],
      theme: {
        extend: {
          fontFamily: {
            'signika': ['Signika', 'sans-serif'],
            'nothingyoucoulddo': ['Nothing You Could Do', 'cursive'],
          }
        }
      },
      plugins: [],
    }
  </script>

  <!-- Fancybox (optional for detail images inside the modal) -->
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
</head>

<body class="dark:bg-black bg-white min-h-screen text-black dark:text-white opacity-0 animate-fade-in transition duration-500">
  <!-- Header -->
  <div id="header"></div>

  <!-- ===== Top: Carousel + CTA (extra top padding so it clears the nav) ===== -->
  <section class="relative pt-36 md:pt-40" x-data="projectsCarousel()">
    <!-- Top CTA; placed with enough offset from the header -->
    <div class="absolute inset-x-0 top-2 md:top-4 z-20 flex justify-center">
      <a href="mailto:tylerjohnb88@gmail.com"
         class="inline-flex items-center rounded-xl bg-white/70 dark:bg-black/70 backdrop-blur px-6 py-3 text-base font-semibold border border-black/10 dark:border-white/10 hover:scale-[1.02] transition"
      >Contact</a>
    </div>

    <!-- Carousel -->
    <div class="relative w-full h-[55vh] md:h-[70vh] overflow-hidden">
      <template x-for="(slide, i) in slides" :key="i">
        <div class="absolute inset-0 will-change-transform"
             x-show="index===i"
             x-transition:enter="transition ease-out duration-700"
             x-transition:enter-start="opacity-0 scale-[1.02] blur-sm"
             x-transition:enter-end="opacity-100 scale-100 blur-0"
             x-transition:leave="transition ease-in duration-700"
             x-transition:leave-start="opacity-100 scale-100 blur-0"
             x-transition:leave-end="opacity-0 scale-[1.02] blur-sm"
             role="img" :aria-label="slide.alt">
          <!-- subtle glass to match header -->
          <div class="absolute inset-0 bg-white/10 dark:bg-black/10 backdrop-blur-sm z-10"></div>
          <img :src="slide.src" :alt="slide.alt" class="absolute inset-0 w-full h-full object-cover" />
        </div>
      </template>
    </div>
  </section>

  <!-- ===== Stacked Project Cards (sticky “shuffle” stack) ===== -->
  <section class="px-6 md:px-8 max-w-screen-xl mx-auto my-16 md:my-24"
           x-data="projectDeck()"
           @keydown.escape.window="close()">

    <!-- Stack container: the height gives room to scroll the three sticky cards -->
    <div class="relative mx-auto max-w-3xl" style="height: 220vh;">
      <!-- Each card is sticky; the next card has a higher z-index and overlaps it, creating the shuffle effect. -->
      <template x-for="(card, i) in cards" :key="card.id">
        <article
          class="sticky top-24 md:top-28 will-change-transform"
          :style="`z-index:${40-i}`"
        >
          <!-- Collapsed card (2:3 ratio) -->
          <div
            class="group relative mx-auto w-full max-w-[840px] aspect-[2/3] overflow-hidden rounded-2xl border border-black/10 dark:border-white/10 bg-white/70 dark:bg-black/70 backdrop-blur shadow-lg cursor-pointer"
            @click="open(card)"
          >
            <img :src="card.thumb" :alt="card.title + ' cover'"
                 class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-[1.03]" />
            <!-- Glass title band -->
            <div class="absolute bottom-0 left-0 right-0 p-5 md:p-6 bg-white/60 dark:bg-black/60 backdrop-blur border-t border-black/10 dark:border-white/10">
              <h3 class="font-signika text-2xl md:text-3xl" x-text="card.title"></h3>
              <p class="opacity-90 text-sm md:text-base mt-1" x-text="card.excerpt"></p>
            </div>
          </div>
        </article>
      </template>
    </div>

    <!-- Modal / Expanded Card -->
    <div x-show="active"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-[9998] bg-black/40 dark:bg-black/60"
         @click.self="close()">
    </div>

    <div x-show="active" x-trap.inert.noscroll="active"
         class="fixed inset-0 z-[9999] p-4 md:p-8 flex items-center justify-center">
      <div
        x-transition:enter="transition transform ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition transform ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
        class="relative w-full max-w-5xl max-h-[90vh] overflow-hidden rounded-2xl border border-black/10 dark:border-white/10 bg-white/70 dark:bg-black/70 backdrop-blur shadow-xl"
      >
        <!-- Close -->
        <button class="absolute top-3 right-3 h-10 w-10 rounded-lg bg-black/10 dark:bg-white/10 flex items-center justify-center"
                @click="close()" aria-label="Close expanded project">
          <span class="sr-only">Close</span>
          <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>

        <!-- Scrollable content -->
        <div class="overflow-y-auto max-h-[90vh]">
          <div class="grid md:grid-cols-2 gap-0">
            <img :src="active?.hero" :alt="active?.title + ' hero image'" class="w-full h-64 md:h-full object-cover" />
            <div class="p-6 md:p-8">
              <h3 class="font-signika text-3xl md:text-4xl mb-3" x-text="active?.title"></h3>
              <p class="opacity-90 mb-4" x-text="active?.description"></p>
              <a :href="active?.mailto"
                 class="inline-flex items-center rounded-xl bg-white/70 dark:bg-black/70 backdrop-blur px-4 py-2 text-sm font-semibold border border-black/10 dark:border-white/10">Contact</a>
            </div>
          </div>

          <!-- Flowing sections -->
          <div class="p-6 md:p-8 grid gap-10">
            <template x-for="section in active?.sections" :key="section.id">
              <div class="grid md:grid-cols-2 gap-6 md:gap-10 items-center">
                <div>
                  <h4 class="font-signika text-2xl mb-2" x-text="section.heading"></h4>
                  <p class="opacity-90" x-text="section.body"></p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <template x-for="img in section.images" :key="img">
                    <a :href="img" data-fancybox="project">
                      <img :src="img" alt="Project detail" class="w-full h-32 md:h-40 object-cover rounded-lg" />
                    </a>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom CTA -->
    <div class="mt-16 text-center">
      <a href="mailto:tylerjohnb88@gmail.com"
         class="inline-flex items-center rounded-xl bg-white/70 dark:bg-black/70 backdrop-blur px-6 py-3 text-base font-semibold border border-black/10 dark:border-white/10 hover:scale-[1.02] transition"
      >Contact</a>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Inject header/footer -->
  <script>
    fetch("src/partials/header.html").then(r=>r.text()).then(h=>document.getElementById("header").innerHTML=h);
    fetch("src/partials/footer.html").then(r=>r.text()).then(h=>document.getElementById("footer").innerHTML=h);
  </script>

  <!-- Fancybox init (optional) -->
  <script>
    if (window.Fancybox) { Fancybox.bind("[data-fancybox='project']", {}); }
  </script>

  <!-- Page scripts -->
  <script src="dist/fade_in.js"></script>
  <script src="dist/menu.js"></script>

  <script>
    // ===== Carousel (5 images from Overview, 4s interval) =====
    function projectsCarousel() {
      return {
        index: 0,
        slides: [
          { src: "/cdn-cgi/image/w=1600/images/photo1.jpg", alt: "Project slide 1" },  // :contentReference[oaicite:1]{index=1}
          { src: "/cdn-cgi/image/w=1600/images/photo2.png", alt: "Project slide 2" },  // :contentReference[oaicite:2]{index=2}
          { src: "/cdn-cgi/image/w=1600/images/photo3.png", alt: "Project slide 3" },  // :contentReference[oaicite:3]{index=3}
          { src: "/cdn-cgi/image/w=1600/images/photo4.jpg", alt: "Project slide 4" },  // :contentReference[oaicite:4]{index=4}
          { src: "/cdn-cgi/image/w=1600/images/photo5.jpg", alt: "Project slide 5" }   // :contentReference[oaicite:5]{index=5}
        ],
        go(i){ this.index = i % this.slides.length; },
        init(){ setInterval(()=>{ this.index = (this.index + 1) % this.slides.length }, 4000); }
      }
    }

    // ===== Stacked cards (use Overview images) =====
    function projectDeck() {
      const email = 'mailto:tylerjohnb88@gmail.com';
      return {
        active: null,
        cards: [
          {
            id: 'p1',
            title: 'Project One',
            excerpt: 'Short project summary goes here.',
            thumb: "/cdn-cgi/image/w=1200/images/photo6.jpg",  // :contentReference[oaicite:6]{index=6}
            hero:  "/cdn-cgi/image/w=1600/images/photo6.jpg",  // :contentReference[oaicite:7]{index=7}
            description: 'A longer description that introduces the project at a high level.',
            mailto: email,
            sections: [
              { id:'s1', heading:'Concept', body:'Describe the creative direction and intent behind the project.',
                images:["/cdn-cgi/image/w=800/images/photo7.jpg","/cdn-cgi/image/w=800/images/photo8.jpg","/cdn-cgi/image/w=800/images/photo9.jpg","/cdn-cgi/image/w=800/images/photo10.png"] },  // 
              { id:'s2', heading:'Production', body:'Share details about the process, collaborators, and challenges.',
                images:["/cdn-cgi/image/w=800/images/photo11.png","/cdn-cgi/image/w=800/images/photo12.png","/cdn-cgi/image/w=800/images/photo13.jpg","/cdn-cgi/image/w=800/images/photo14.jpg"] }      // 
            ]
          },
          {
            id: 'p2',
            title: 'Project Two',
            excerpt: 'Short project summary goes here.',
            thumb: "/cdn-cgi/image/w=1200/images/photo15.jpg",  // :contentReference[oaicite:10]{index=10}
            hero:  "/cdn-cgi/image/w=1600/images/photo15.jpg",  // :contentReference[oaicite:11]{index=11}
            description: 'A longer description that introduces the project at a high level.',
            mailto: email,
            sections: [
              { id:'s1', heading:'Concept', body:'Overview of the idea and inspiration.',
                images:["/cdn-cgi/image/w=800/images/photo16.jpg","/cdn-cgi/image/w=800/images/photo17.jpg","/cdn-cgi/image/w=800/images/photo18.jpg","/cdn-cgi/image/w=800/images/photo19.jpg"] },     // :contentReference[oaicite:12]{index=12}
              { id:'s2', heading:'Production', body:'Notes on logistics and execution.',
                images:["/cdn-cgi/image/w=800/images/photo20.jpg","/cdn-cgi/image/w=800/images/photo21.jpg","/cdn-cgi/image/w=800/images/photo22.jpg","/cdn-cgi/image/w=800/images/photo23.jpg"] }      // 
            ]
          },
          {
            id: 'p3',
            title: 'Project Three',
            excerpt: 'Short project summary goes here.',
            thumb: "/cdn-cgi/image/w=1200/images/photo4.jpg",   // :contentReference[oaicite:14]{index=14}
            hero:  "/cdn-cgi/image/w=1600/images/photo4.jpg",   // :contentReference[oaicite:15]{index=15}
            description: 'A longer description that introduces the project at a high level.',
            mailto: email,
            sections: [
              { id:'s1', heading:'Concept', body:'Context and visual approach.',
                images:["/cdn-cgi/image/w=800/images/photo1.jpg","/cdn-cgi/image/w=800/images/photo2.png","/cdn-cgi/image/w=800/images/photo3.png","/cdn-cgi/image/w=800/images/photo5.jpg"] },      // :contentReference[oaicite:16]{index=16}
              { id:'s2', heading:'Production', body:'Team, locations, and timing.',
                images:["/cdn-cgi/image/w=800/images/photo6.jpg","/cdn-cgi/image/w=800/images/photo7.jpg","/cdn-cgi/image/w=800/images/photo8.jpg","/cdn-cgi/image/w=800/images/photo9.jpg"] }        // :contentReference[oaicite:17]{index=17}
            ]
          }
        ],
        open(card){ this.active = card; },
        close(){ this.active = null; }
      }
    }
  </script>

  <!-- Slightly glassy Fancybox backdrop to match header -->
  <style>
    .fancybox__backdrop { background: rgba(255,255,255,0.3) !important; backdrop-filter: blur(8px); }
  </style>
</body>
</html>
